<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>@@subject@@</title></head>
<body style="margin:0;padding:0;background:#f3f4f6;">
<div style="display:none;max-height:0;overflow:hidden;opacity:0;">@@preheader@@@@preheader_pad@@</div>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f3f4f6;"><tr><td align="center" style="padding:24px 12px;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;background:#ffffff;border-radius:12px;overflow:hidden;font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#1f2937;">
<tr><td style="height:6px;background:@@accent@@;font-size:0;line-height:0;">&nbsp;</td></tr>
<tr><td style="padding:24px 28px 8px;">
<span style="display:inline-block;padding:3px 10px;border-radius:999px;background:@@badge_bg@@;color:@@accent@@;font-size:12px;font-weight:700;letter-spacing:.3px;text-transform:uppercase;">@@badge@@</span>
<h1 style="margin:14px 0 8px;font-size:21px;line-height:1.3;color:#111827;">@@title@@</h1>
<p style="margin:0;font-size:15px;line-height:1.55;color:#374151;">@@summary@@</p>
</td></tr>
@@blocks@@
<tr><td style="padding:20px 28px 24px;border-top:1px solid #e5e7eb;font-size:12px;line-height:1.5;color:#6b7280;">@@footer@@</td></tr>
</table>
</td></tr></table>
</body></html>
