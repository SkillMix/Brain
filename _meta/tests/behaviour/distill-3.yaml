# Distill proposes; a person signs.
name: a candidate is a draft in the inbound folder, never a signed page
command:
- python
- _meta/tools/distill.py
- '{root}'
setup:
  files:
    space.yaml:
      shape: 1
      profile: personal
      mode: fixture
      time_scale: 1440
      name: ada
      owner: Ada Okafor
      owner_email: ada@lantern.example
      audience:
      - Ada Okafor
      parent: brain
      sources:
      - name: mail
        adapter: files
        audience: owner
    work/.gitkeep: ''
    journal/.gitkeep: ''
    outbox/.gitkeep: ''
    _meta/subjects.yaml:
      subjects:
      - id: harbor
        kind: projects
        title: Harbor
        state: active
        owner: Ada Okafor
        home: ada
        match:
          label: Harbor
      - id: ben
        kind: people
        title: Ben Liu
        state: active
    knowledge/sources/2026/10/m-s8.md: "---\nid: p-0000c502\ntype: source\ntitle: Harbor plan\nstatus: draft\ngenerated:\n\
      \  by: sweep\n  at: '2026-10-04T09:00:00Z'\nat: '2026-10-04T09:00:00Z'\nsubject: harbor\nrecord: m-s8\n---\n\
      The Harbor plan holds.\n"
env:
  SPACE_NOW: '2026-10-05T09:00:00Z'
expect:
  exit: 0
  writes_only_under:
  - _inbound/candidates/
  never_contains:
    _inbound/**:
    - 'status: stable'
