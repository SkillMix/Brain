# Submit signs only the text that was read back. At the command line a bare yes on a page
# names no fingerprint, so it is refused: exit 0, the candidate stays a draft where it was,
# nothing lands, and only the refusal line reaches the log. The subject is classified, so the
# candidate is offered for a signature and the refusal, not the classification gate, keeps it.
name: a bare yes on a page is refused at the command line
command:
  - python
  - _meta/tools/sign.py
  - "{root}"
  - apply
  - --by
  - "Ada Okafor"
  - --verdicts
  - "{root}/_meta/state/scenario-verdicts.yaml"
setup:
  files:
    space.yaml:
      shape: 1
      profile: personal
      mode: fixture
      time_scale: 1440
      name: ada
      owner: Ada Okafor
      owner_email: ada@lantern.example
      audience: [Ada Okafor]
      parent: brain
    work/.gitkeep: ""
    journal/.gitkeep: ""
    outbox/.gitkeep: ""
    _meta/subjects.yaml:
      subjects:
        - id: harbor
          kind: projects
          title: Harbor
          state: active
          owner: Ada Okafor
          home: harbor
          classification: {class: walled, state: settled, home: harbor, crew: [ada], reason: its own space,
                           decided_by: Ada Okafor, at: "2026-10-01T09:00:00Z"}
          match: {label: Harbor, channel: "#harbor"}
    _meta/state/scenario-verdicts.yaml: "harbor: yes\n"
    _inbound/candidates/harbor.md: |
      ---
      id: p-0000c001
      type: entity
      title: Harbor
      status: draft
      generated: {by: distill, at: "2026-10-05T09:00:00Z"}
      subject: harbor
      evidence: [m-scenario-1]
      ---
      # Harbor

      Extension for the client. Go-live moves to 3 November.

      ## New evidence

      - 2026-10-02 the client moved the go-live to 3 November
env: {SPACE_NOW: "2026-10-05T09:00:00Z"}
expect:
  exit: 0
  writes_only_under: []
  never_contains:
    "knowledge/**": ["status: stable"]
  must_exist: ["_inbound/candidates/harbor.md"]
  must_not_exist: ["knowledge/projects/**/*.md"]
