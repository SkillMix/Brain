# Never send; file what was sent; archive what idles.
name: an idle draft is archived, never deleted
command:
- python
- _meta/tools/outbox_reconcile.py
- '{root}'
setup:
  files:
    space.yaml:
      shape: 1
      profile: personal
      mode: fixture
      time_scale: 1440
      name: ada
      owner: Ada Okafor
      owner_email: ada@lantern.example
      audience:
      - Ada Okafor
      parent: brain
      sources:
      - name: mail
        adapter: files
        audience: owner
    work/.gitkeep: ''
    journal/.gitkeep: ''
    outbox/.gitkeep: ''
    _meta/subjects.yaml:
      subjects:
      - id: harbor
        kind: projects
        title: Harbor
        state: active
        owner: Ada Okafor
        home: ada
        match:
          label: Harbor
      - id: ben
        kind: people
        title: Ben Liu
        state: active
    outbox/old-draft.md: "---\nid: p-0000c901\ntype: concept\ntitle: Old draft\nstatus: draft\ngenerated:\n  by:\
      \ agent\n  at: '2026-09-01T09:00:00Z'\n---\nAn old draft.\n"
env:
  SPACE_NOW: '2026-10-05T09:00:00Z'
expect:
  exit: 0
  writes_only_under:
  - outbox/
  must_exist:
  - outbox/archive/old-draft.md
