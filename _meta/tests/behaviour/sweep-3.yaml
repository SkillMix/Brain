# Each space sweeps the sources it declared.
name: an undeclared feed is never swept
command:
- python
- _meta/tools/sweep.py
- '{root}'
setup:
  files:
    space.yaml:
      shape: 1
      profile: personal
      mode: fixture
      time_scale: 1440
      name: ada
      owner: Ada Okafor
      owner_email: ada@lantern.example
      audience:
      - Ada Okafor
      parent: brain
      sources:
      - name: mail
        adapter: files
        audience: owner
    work/.gitkeep: ''
    journal/.gitkeep: ''
    outbox/.gitkeep: ''
    _meta/subjects.yaml:
      subjects:
      - id: harbor
        kind: projects
        title: Harbor
        state: active
        owner: Ada Okafor
        home: ada
        match:
          label: Harbor
      - id: ben
        kind: people
        title: Ben Liu
        state: active
    _meta/state/feed/chat.jsonl: '{"id": "c-s1", "source": "mail", "kind": "message", "at": "2026-10-02T09:15:00Z",
      "from": "ops@tidewater.example", "to": ["ada@lantern.example"], "subject": "Harbor plan", "text": "The Harbor
      plan holds.", "identifiers": {"labels": ["Harbor"]}, "attachments": []}

      '
env:
  SPACE_NOW: '2026-10-05T09:00:00Z'
expect:
  exit: 0
  writes_only_under: []
  must_not_exist:
  - knowledge/sources/2026/10/c-s1.md
