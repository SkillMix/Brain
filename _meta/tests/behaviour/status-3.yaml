# The brain's roll-up comes from each project's home.
name: the brain's projects page is generated, never kept by hand
command:
- python
- _meta/tools/status.py
- '{root}'
setup:
  files:
    space.yaml:
      shape: 1
      profile: brain
      mode: fixture
      time_scale: 1440
      name: brain
      owner: Ada Okafor
      owner_email: ada@lantern.example
      audience: everyone
      sources: []
    _meta/subjects.yaml:
      subjects:
      - id: harbor
        kind: projects
        title: Harbor
        state: active
        owner: Ada Okafor
        home: ada
        match:
          label: Harbor
      - id: ben
        kind: people
        title: Ben Liu
        state: active
env:
  SPACE_NOW: '2026-10-05T09:00:00Z'
expect:
  exit: 0
  writes_only_under:
  - live/
  - knowledge/
  - index.md
  - _meta/subjects.yaml
  - AGENTS.md
  - _inbound/needs-you/
  must_exist:
  - live/projects.md
