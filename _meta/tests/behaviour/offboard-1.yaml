# Agents never delete: the raw records wait for the person's own command.
name: offboard lists raw records and keeps them
command:
- python
- _meta/tools/offboard.py
- '{root}'
setup:
  files:
    space.yaml:
      shape: 1
      profile: personal
      mode: fixture
      time_scale: 1440
      name: ada
      owner: Ada Okafor
      owner_email: ada@lantern.example
      audience:
      - Ada Okafor
      parent: brain
      sources:
      - name: mail
        adapter: files
        audience: owner
    work/.gitkeep: ''
    journal/.gitkeep: ''
    outbox/.gitkeep: ''
    _meta/subjects.yaml:
      subjects:
      - id: harbor
        kind: projects
        title: Harbor
        state: active
        owner: Ada Okafor
        home: ada
        match:
          label: Harbor
      - id: ben
        kind: people
        title: Ben Liu
        state: active
    knowledge/sources/2026/10/m1.md: "---\nid: p-0000c301\ntype: source\ntitle: A mail\nstatus: draft\ngenerated:\n\
      \  by: sweep\n  at: '2026-10-02T09:00:00Z'\n---\nBody.\n"
env:
  SPACE_NOW: '2026-10-05T09:00:00Z'
expect:
  exit: 0
  writes_only_under:
  - _meta/subjects.yaml
  must_exist:
  - knowledge/sources/2026/10/m1.md
