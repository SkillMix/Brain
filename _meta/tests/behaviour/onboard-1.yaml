# The owner invites; the colleague runs onboarding on their own machine.
name: an invitation writes the colleague's answers and one item, nothing else
command:
- python
- _meta/tools/onboard.py
- '{root}'
- --invite
- ben
setup:
  files:
    space.yaml:
      shape: 1
      profile: brain
      mode: fixture
      time_scale: 1440
      name: brain
      owner: Ada Okafor
      owner_email: ada@lantern.example
      audience: everyone
      sources: []
    _meta/subjects.yaml:
      subjects:
      - id: harbor
        kind: projects
        title: Harbor
        state: active
        owner: Ada Okafor
        home: ada
        match:
          label: Harbor
      - id: ben
        kind: people
        title: Ben Liu
        state: active
env:
  SPACE_NOW: '2026-10-05T09:00:00Z'
expect:
  exit: 0
  writes_only_under:
  - _inbound/needs-you/
  must_exist:
  - _meta/state/invitations/ben.yaml
