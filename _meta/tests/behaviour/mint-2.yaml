# Minting moves the subject's home, not its id; the seed stays on the desk.
name: minting a desk seed moves the subject's home, never its pages here
command:
- python
- _meta/tools/mint.py
- '{root}'
- --seed
- work/projects/lighthouse/kickoff
- --name
- lighthouse
- --crew
- Ada Okafor
- Ben Liu
- --offline
setup:
  files:
    space.yaml:
      shape: 1
      profile: personal
      mode: fixture
      time_scale: 1440
      name: ada
      owner: Ada Okafor
      owner_email: ada@lantern.example
      audience:
      - Ada Okafor
      parent: brain
      sources:
      - name: mail
        adapter: files
        audience: owner
    work/.gitkeep: ''
    journal/.gitkeep: ''
    outbox/.gitkeep: ''
    _meta/subjects.yaml:
      subjects:
      - id: harbor
        kind: projects
        title: Harbor
        state: active
        owner: Ada Okafor
        home: ada
        match:
          label: Harbor
      - id: ben
        kind: people
        title: Ben Liu
        state: active
    work/projects/lighthouse/kickoff/brief.md: '# Brief


      The lighthouse refit.

      '
env:
  SPACE_NOW: '2026-10-05T09:00:00Z'
expect:
  exit: 0
  writes_only_under:
  - _meta/subjects.yaml
  - _inbound/needs-you/
  must_exist:
  - work/projects/lighthouse/kickoff/brief.md
