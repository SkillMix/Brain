# The question log is read first, as pointers; reading writes nothing.
name: a looked-up question changes nothing
command:
- python
- _meta/tools/questions_log.py
- '{root}'
- lookup
- --question
- Where does Harbor stand?
setup:
  files:
    space.yaml:
      shape: 1
      profile: personal
      mode: fixture
      time_scale: 1440
      name: ada
      owner: Ada Okafor
      owner_email: ada@lantern.example
      audience:
      - Ada Okafor
      parent: brain
      sources:
      - name: mail
        adapter: files
        audience: owner
    work/.gitkeep: ''
    journal/.gitkeep: ''
    outbox/.gitkeep: ''
    _meta/subjects.yaml:
      subjects:
      - id: harbor
        kind: projects
        title: Harbor
        state: active
        owner: Ada Okafor
        home: ada
        match:
          label: Harbor
      - id: ben
        kind: people
        title: Ben Liu
        state: active
    _meta/questions.log: '{"at": "2026-10-01T09:00:00Z", "question": "Where does Harbor stand?", "subject": "harbor",
      "tier": "evidence", "pages": []}

      '
env:
  SPACE_NOW: '2026-10-05T09:00:00Z'
expect:
  exit: 0
  writes_only_under: []
