# Retired: the `checks` job arms auto-merge as its last step, so a sync costs one job, not two.
# The file stays because a template update never deletes a file; it starts nothing.
name: auto-merge

on:
  workflow_dispatch:

permissions: {}

jobs:
  retired:
    if: false
    runs-on: ubuntu-latest
    steps:
      - run: echo "retired; checks.yml arms auto-merge"
