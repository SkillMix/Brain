# Setup on every system: the unit tests, the behaviour scenarios and an offline start from a
# fixture invitation on Windows, macOS and Linux; on macOS and Linux the unit tests also run the
# generated cron command under `env -i` with a stub `gh` on the registration PATH. `bare` runs
# the whole first step on a machine with nothing on it (no git, gh or Python): the bootstrap
# installs a Python, the doctor installs git and gh. The unit tests also run on Python 3.10, the
# oldest the README promises, on Linux. Not required checks (`checks` is). Runs
# when the setup tools change, only in the template repository (it carries GitHub's template
# flag): in a space every job is skipped before a runner starts, so it costs nothing.
name: platforms

on:
  pull_request:
    paths:
      - "_meta/tools/onboard.py"
      - "_meta/tools/start.py"
      - "_meta/tools/offboard.py"
      - "_meta/tools/sync.py"
      - "_meta/tools/doctor.py"
      - "_meta/tools/routine.py"
      - "_meta/tools/bootstrap.sh"
      - "_meta/tools/bootstrap.ps1"
      - "_meta/tools/tests/test_sync_task.py"
      - "_meta/tools/tests/test_start.py"
      - "_meta/tools/tests/test_doctor.py"
      - "_meta/tools/tests/test_routines.py"
      - "_meta/templates/**"
      - ".github/workflows/platforms.yml"
  push:
    branches: [main]
    paths:
      - "_meta/tools/onboard.py"
      - "_meta/tools/start.py"
      - "_meta/tools/offboard.py"
      - "_meta/tools/sync.py"
      - "_meta/tools/doctor.py"
      - "_meta/tools/routine.py"
      - "_meta/tools/bootstrap.sh"
      - "_meta/tools/bootstrap.ps1"
      - "_meta/tools/tests/test_sync_task.py"
      - "_meta/tools/tests/test_start.py"
      - "_meta/tools/tests/test_doctor.py"
      - "_meta/tools/tests/test_routines.py"
      - "_meta/templates/**"
      - ".github/workflows/platforms.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  platforms:
    if: github.event.repository.is_template
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12"]
        # the oldest Python the README promises, on one system to keep the run short
        include:
          - os: ubuntu-latest
            python: "3.10"
    runs-on: ${{ matrix.os }}
    env:
      GIT_TERMINAL_PROMPT: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}

      - run: pip install pyyaml pytest

      - name: Unit tests
        run: python -m pytest _meta/tools/tests -q

      - name: Behaviour scenarios
        run: python _meta/tools/behaviour.py . --all

      - name: Offline start from a fixture invitation, and the cron command under env -i
        run: python -m pytest _meta/tools/tests/test_start.py _meta/tools/tests/test_sync_task.py -v -k "start_command or empty_environment"

  bare:
    if: github.event.repository.is_template
    runs-on: ubuntu-latest
    container: ubuntu:24.04
    steps:
      - name: A downloader and certificates, nothing else
        run: apt-get update -qq && apt-get install -y -qq curl ca-certificates

      # without git on PATH, checkout downloads the tree through the API
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Nothing installed yet
        run: |
          for tool in git gh python3 python; do
            if command -v "$tool" >/dev/null 2>&1; then echo "$tool is already here"; exit 1; fi
          done

      - name: Bootstrap a Python, then the doctor installs git and gh
        run: |
          sh _meta/tools/bootstrap.sh --doctor | tee doctor.txt || true
          grep -E "^ok +doctor: python" doctor.txt
          grep -E "^ok +doctor: git " doctor.txt
          grep -E "^ok +doctor: gh " doctor.txt
          grep -E "^owner +doctor: github sign-in" doctor.txt

      - name: Offline start from a fixture invitation, and the doctor's own tests
        run: |
          export PATH="$HOME/.spaces/tools/gh/bin:$HOME/.spaces/tools/uv:$PATH"
          uv venv /tmp/tests --python 3.12
          uv pip install --python /tmp/tests/bin/python pyyaml pytest
          /tmp/tests/bin/python -m pytest _meta/tools/tests/test_start.py _meta/tools/tests/test_doctor.py -q -k "start_command or doctor or bootstrap"
