# The release: a pushed tag `v*` builds the template as one zip with its checksum
# (`_meta/tools/template_archive.py`) and attaches both to the GitHub release, so a setup can
# download the template, check it and unpack it without git or GitHub's tool. The job holds the
# write token, so it runs only the tagged commit's own archive tool and nothing from a pull request.
# The tag reaches the shell through `env`, never inside a `run:` line: a tag name can hold shell
# syntax. Runs only in the repository with GitHub's template flag (template sync copies this file
# into every space, where the job is skipped before a runner starts). Only a release name builds
# (`vX.Y.Z`, or `vX.Y.Z-rcN` for a candidate), and only on a commit the default branch holds: a tag
# on a branch nobody merged is never published, so every release went through the checks first.
# The template's pull requests land on green; the tag is the human gate, created by a maintainer
# who read what changed since the last release. Who may create or move such a tag is a repository
# setting (a tag ruleset, SECURITY.md); this job cannot stop a push, only refuse to publish it, and
# it refuses while that ruleset is missing (`template_archive.py ruleset`).
name: release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+", "v[0-9]+.[0-9]+.[0-9]+-rc[0-9]+"]

permissions:
  contents: read

jobs:
  release:
    if: github.event.repository.is_template
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: The tag is a release name on the default branch
        env:
          TAG: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-rc[0-9]+)?$'; then
            echo "::error::$TAG is not a release name (vX.Y.Z or vX.Y.Z-rcN)"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/${DEFAULT_BRANCH}"; then
            echo "::error::$TAG points at a commit that is not on ${DEFAULT_BRANCH}: nothing is published"
            exit 1
          fi

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      # The tag is the one human gate on what reaches the spaces, so the job checks the setting
      # that makes it one instead of trusting it is there: an active tag ruleset on refs/tags/v*
      # that restricts creating and moving a release tag and that this token cannot bypass.
      - name: Only a maintainer can make a release tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python _meta/tools/template_archive.py ruleset "$GH_REPO"

      - name: Build the archive and its checksum
        env:
          TAG: ${{ github.ref_name }}
        run: python _meta/tools/template_archive.py build . dist "$TAG"

      # The release may exist already (drafted by hand, or this run is a retry): it is created only
      # when `gh release view` fails, and the files replace any earlier upload.
      - name: Attach both files to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --title "$TAG" --notes ""
          fi
          gh release upload "$TAG" "dist/brain-template-${TAG}.zip" dist/SHA256SUMS --clobber
